<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Read — Crimson Aether</title>
<script src="/chapters.js"></script>
<script>
  /* Old reader link: send people to where they left off, or the chapter list. */
  var dest = "/chapters/";
  try {
    var slug = localStorage.getItem("ca-last-chapter");
    if (slug && window.CA_findChapter(slug)) dest = "/chapter/" + slug + "/";
    else dest = "/chapter/prologue/";
  } catch (e) {}
  window.location.replace(dest);
</script>
<meta http-equiv="refresh" content="1;url=/chapters/">
</head>
<body style="background:#0a0708;color:#efe4cc;font-family:serif;text-align:center;padding-top:120px;">
<p>Taking you to the reader… <a href="/chapters/" style="color:#c9a84c;">Tap here</a> if nothing happens.</p>
</body>
</html>
